<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say That Sound — Voice Coach</title>
    <meta name="description" content="Real-time pronunciation coaching voice agent">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Say That Sound</h1>
            <p class="subtitle">Pronunciation Practice — Step 1 Voice Loop</p>
        </header>

        <div id="status-bar">
            <span id="connection-dot" class="dot disconnected"></span>
            <span id="connection-text">Disconnected</span>
        </div>

        <div id="controls">
            <button id="connect-btn" onclick="toggleConnection()">Connect</button>
        </div>

        <div id="mic-section">
            <label>Mic Level</label>
            <canvas id="mic-meter" width="300" height="24"></canvas>
        </div>

        <div id="transcript-section">
            <label>Transcript Log</label>
            <div id="transcript-log"></div>
        </div>
    </div>

    <!-- LiveKit Client SDK (ESM from CDN) -->
    <script type="module" src="/static/app.js"></script>
</body>
</html>
